# Signal Catalogue — the deterministic rule table the pipeline's core
# generation path reads. Hand-owned, checked in, versioned. Never written to
# by suggest-rules.ts directly — that tool only ever writes
# proposed-updates.json for human review.
#
# Seeded from requirements v0.6 §3's Slice-1 table (Python/Node only;
# Java stays Slice 2 backlog).

version: "0.1.0"

rules:
  # --- Native CodeGraph route typing (source: native-route) ---
  - id: flask-route
    language: python
    framework: flask
    matchSignal: "app.route"
    matchSource: native-route
    category: http-entry-point
    weight: 40
    calmNodeType: service

  - id: fastapi-route
    language: python
    framework: fastapi
    matchSignal: "router"
    matchSource: native-route
    category: http-entry-point
    weight: 40
    calmNodeType: service

  - id: nestjs-route
    language: typescript
    framework: nestjs
    matchSignal: "get|post|put|patch|delete"
    matchSource: native-route
    category: http-entry-point
    weight: 40
    calmNodeType: service

  # --- extractFromSource() decorates refs (source: decorator) ---
  # Requirements v0.6 §5: the resolved mechanism. These are raw decorator
  # names as returned by CodeGraph.extractFromSource()'s unresolvedReferences
  # filtered to referenceKind === 'decorates'.
  - id: flask-route-decorator
    language: python
    framework: flask
    matchSignal: "route"
    matchSource: decorator
    category: http-entry-point
    weight: 40
    calmNodeType: service

  - id: fastapi-verb-decorator
    language: python
    framework: fastapi
    matchSignal: "get|post|put|patch|delete"
    matchSource: decorator
    category: http-entry-point
    weight: 40
    calmNodeType: service

  # @Controller() is a CLASS-level marker (analogous to Flask(__name__)/FastAPI()) —
  # it identifies "this file is a service," it is NOT itself a route the way
  # @Get()/@Post() are. Miscategorizing it as http-entry-point (as an earlier
  # version of this catalogue did) double-counts evidence against the real
  # routes AND makes build-calm.ts emit a nonsense path-interface with
  # path:"Controller". framework-bootstrap is the correct category, same
  # tier as Flask()/FastAPI() below.
  - id: nestjs-controller-decorator
    language: typescript
    framework: nestjs
    matchSignal: "Controller"
    matchSource: decorator
    category: framework-bootstrap
    weight: 25
    calmNodeType: service

  # NestJS GraphQL class marker only. @Query/@Mutation are not catalogued:
  # the same TypeScript bare word matches TypeORM's @Query, and findRule()
  # does not use `framework`. Operations stay native-route when CodeGraph types them.
  - id: nestjs-graphql-resolver-decorator
    language: typescript
    framework: nestjs-graphql
    matchSignal: "Resolver"
    matchSource: decorator
    category: framework-bootstrap
    weight: 25
    calmNodeType: service

  - id: nestjs-verb-decorator
    language: typescript
    framework: nestjs
    matchSignal: "Get|Post|Put|Patch|Delete"
    matchSource: decorator
    category: http-entry-point
    weight: 40
    calmNodeType: service

  # --- Framework bootstrap markers ---
  - id: flask-bootstrap
    language: python
    framework: flask
    matchSignal: "Flask"
    matchSource: decorator
    category: framework-bootstrap
    weight: 25
    calmNodeType: service

  - id: fastapi-bootstrap
    language: python
    framework: fastapi
    matchSignal: "FastAPI"
    matchSource: decorator
    category: framework-bootstrap
    weight: 25
    calmNodeType: service

  # --- Java: JAX-RS (route composition, see analysis/jaxrs-route-composer.ts) ---
  # CodeGraph has no native `route` typing for JAX-RS (Spring/Play only,
  # resolution/frameworks/index.js) — the composer joins class-level +
  # method-level @Path into one full route string ("GET /v1/charges/{id}"),
  # emitted as a synthetic decorator fact matched here. Verified 19/19 real
  # routes across 3 real resource files from a reference Java/JAX-RS banking platform.
  # `language: java` matters here specifically because this matchSignal shape
  # ("GET|POST|...") would otherwise ambiguously match nestjs-verb-decorator's
  # alternation too — findRule() now disambiguates by language (rule-schema.ts).
  - id: jax-rs-composed-route
    language: java
    framework: jax-rs
    matchSignal: "GET|POST|PUT|DELETE|PATCH"
    matchSource: decorator
    category: http-entry-point
    weight: 40
    calmNodeType: service

  # --- Java: JPA persistence (decorator-based, requirements v0.6 §5) ---
  # CodeGraph gives zero native persistence signal for JPA (confirmed
  # repeatedly) — @Entity is decorator-detected the same mechanism as routes.
  # Weighted at 40 (sufficient alone, same tier as a primary route signal),
  # not the Graphify-persistence-detector's flat 20 — that detector's units
  # bypass the confidence floor entirely (pushed directly in run-slice.ts),
  # while units built via signal-mapper.ts's per-file evidence path (this
  # one) ARE floor-checked at 40, so a lower weight here would silently drop
  # every bare @Entity class into ignored-items as INSUFFICIENT_EVIDENCE.
  - id: jpa-entity
    language: java
    framework: jpa
    matchSignal: "Entity"
    matchSource: decorator
    category: persistence
    weight: 40
    calmNodeType: database

  - id: jpa-table
    language: java
    framework: jpa
    matchSignal: "Table"
    matchSource: decorator
    category: persistence
    weight: 10
    calmNodeType: database

  # --- T-LR-3 (BACKLOG.md "Plain-interface bridge detection"): bare Spring
  # @Service stereotype (requirements v0.10-era gap, named directly in
  # Architect_Pilot_Feedback_Notes.md Entry 13). Real evidence: a reference
  # Java/JAX-RS banking platform's PortfolioCommandSourceWritePlatformServiceImpl
  # carries a bare `@Service` with no other framework marker (no `@Path`,
  # no `@Entity`, no `@PreAuthorize`) — before this row, signal-catalogue.yml
  # had no rule watching for `@Service`/`@Component`/`@Repository` at all
  # (confirmed by a direct catalogue read before writing this row, not
  # assumed), so a real Spring-managed bean like this produced zero
  # evidence and zero units, invisible even to `multi-hop-bridge-detector.ts`'s
  # implementer-disambiguation. Same decorator-extraction mechanism as
  # `jpa-entity`/`spring-preauthorize` above — no new extraction code, a
  # missing vocabulary row. Weighted 40 (sufficient alone, same tier as
  # those two rows): a bare stereotype is Spring's own declaration that a
  # class is a managed service bean, not weaker evidence than a route or a
  # persistence annotation.
  #
  # Deliberately scoped to `@Service` ONLY, not also `@Component`/
  # `@Repository` — only `@Service` has a real, cited evidence sample
  # (Entry 13). `@Component` is Spring's generic stereotype (used for many
  # non-service-shaped beans too — configuration helpers, converters); a
  # class-forming rule for it needs its own real evidence sample before
  # shipping, not "it seems likely," per `Catalogue_Intake.md`.
  # `@Repository` already has real evidence but for a DIFFERENT extraction
  # path (`spring-data-repository-extends`, an `extends JpaRepository<...>`
  # structural match) — adding `@Repository` here as a bare-decorator match
  # too would need its own separate evidence sample distinguishing it from
  # that existing row, not bundled in speculatively.
  - id: spring-service-stereotype
    language: java
    framework: spring
    matchSignal: "Service"
    matchSource: decorator
    category: framework-bootstrap
    weight: 40
    calmNodeType: service
    # T-LR-3 — this row is ALSO the sole source of which stereotype names
    # multi-hop-bridge-detector.ts's disambiguation branch treats as
    # corroborating evidence (rule-schema.ts's bridgeStereotypeSignals()).
    # Never a second, hardcoded copy of "Service" in the detector itself —
    # extending disambiguation to a new stereotype later is this one flag on
    # a new/existing row, not a code change.
    bridgeStereotype: true

  # T-onboarding-1a — found reviewing this catalogue against a real minimal
  # Spring Boot app (coe-lab's java-spring-orders fixture): NestJS's own
  # @Controller already has a row above (nestjs-controller-decorator), but
  # Spring MVC's class-level stereotypes had none at all, so a completely
  # correct scan (real routes detected, real service->service relationship
  # resolved) still reported @RestController/@Controller as "unmapped" —
  # not a detection failure, a real catalogue-completeness gap. Same
  # framework-bootstrap reasoning as nestjs-controller-decorator above:
  # @RestController/@Controller mark "this class is a Spring MVC
  # controller," they are never themselves a route the way @GetMapping/
  # @PostMapping are — categorizing them as http-entry-point would
  # double-count evidence against the real native-typed routes.
  #
  # Deliberately does NOT include RequestMapping: unlike RestController/
  # Controller, @RequestMapping is genuinely dual-purpose in real Spring MVC
  # source — a class-level base-path prefix (framework-bootstrap-shaped,
  # like this row) OR a real method-level route when used without
  # @GetMapping/@PostMapping (http-entry-point-shaped, already covered by
  # CodeGraph's native route typing). findRule() has no fromNodeKind
  # (class-vs-method) input to disambiguate the two uses safely — adding a
  # single row here would either double-count the method-level case or miss
  # the class-level one, so it stays out until that disambiguation exists.
  - id: spring-mvc-controller-decorator
    language: java
    framework: spring
    matchSignal: "RestController|Controller"
    matchSource: decorator
    category: framework-bootstrap
    weight: 25
    calmNodeType: service

  # --- Java: Spring Security control evidence (requirements v0.10 §0 / v0.11) ---
  # Real evidence: spikes/fineract/repo/fineract-core/.../DatatableWriteService.java
  # — a pure Java `interface` with @PreAuthorize on every method, NO @Path/
  # @RestController at all. Weighted 40 (sufficient alone, same tier as
  # jpa-entity) deliberately: this is a genuine, previously-completely-invisible
  # architectural unit (an authorization-enforcing service layer with no HTTP
  # surface of its own) — the same class of gap persistence-detector.ts closed
  # for db.py, now closed for RBAC-only service interfaces. The actual control
  # attachment (which control-id, what evidence) is a SEPARATE lookup against
  # control-requirement-catalogue.yml (rules/construct-mapping-schema.ts),
  # done by control-builder.ts — this row only tells signal-mapper.ts "this
  # signal is control-category evidence for a service unit," the same
  # division of labor signal-catalogue.yml already has for every other
  # category.
  - id: spring-preauthorize
    language: java
    framework: spring-security
    matchSignal: "PreAuthorize"
    matchSource: decorator
    category: security-control
    weight: 40
    calmNodeType: service

  # --- AREC Wave 3 T-D1 (C-call): call-site security-control evidence ---
  # v0.10 §0 specified TWO control-detection mechanisms: decorator (built
  # above, spring-preauthorize) and call-based (never built until now).
  # Real evidence, verified via a direct extractFromSource() probe before
  # writing this row (not assumed): a reference Java/JAX-RS banking platform's ChargesApiResource.java calls
  # `context.authenticatedUser().validateHasReadPermission(RESOURCE_NAME_FOR_PERMISSIONS)`
  # at lines 84/101/129 — CodeGraph's extractFromSource() reports this as a
  # `referenceKind: 'calls'` entry with `referenceName:
  # "context.authenticatedUser().validateHasReadPermission"`, the exact same
  # mechanism family as the `decorates` refs every other Java row here uses,
  # just a different reference kind (see codegraph-provider.ts's new
  # extractCallFacts()). Weighted 40, same tier as spring-preauthorize — this
  # IS definite evidence of an authorization check (a reference Java/JAX-RS banking platform's own security
  # API), not weaker just because it's a call instead of a decorator.
  - id: java-call-site-permission-check
    language: java
    framework: java-security-context-api
    matchSignal: "validateHasReadPermission|validateHasPermission|validateHasCheckerPermission"
    matchSource: call
    category: security-control
    weight: 40
    calmNodeType: service

  # T-R2-2 (C-call expansion, Catalogue_Intake.md). Real evidence, verified
  # directly against real a reference Java governance platform source (spikes/waltz/repo), not assumed:
  # `WebUtilities.requireRole()` (waltz-web/.../WebUtilities.java:127-150)
  # calls `userRoleService.hasRole(user, requiredRoles)` and THROWS
  # `NotAuthorizedException()` when it returns false — a genuine, definite
  # fine-grained role-authorization gate, same strength as a reference Java/JAX-RS banking platform's
  # validateHasPermission family, just a different framework's own vocabulary
  # (confirmed real call sites beyond the helper itself: SettingsEndpoint.java:100,
  # LicenceEndpoint.java:119, BulkUploadLegalEntityRelationshipEndpoint.java:98).
  # A DIFFERENT real repo's real vocabulary, not a reference Java/JAX-RS banking platform-shaped guess —
  # exactly the breadth this task exists to add. Weighted 40, same tier as
  # the other definite (not merely corroborating) call-site controls.
  - id: java-user-role-service-check
    language: java
    framework: java-role-based-security
    matchSignal: "hasRole"
    matchSource: call
    category: security-control
    weight: 40
    calmNodeType: service

  # T-R2-2 (C-call expansion). Real evidence: a reference Java/JAX-RS banking platform's OWN
  # PlatformSecurityContext (the same class java-call-site-permission-check
  # above already keys off) also exposes `isAuthenticated()` — confirmed via
  # its real implementation (the reference platform's SpringSecurityPlatformSecurityContext.java:81):
  # `void isAuthenticated() { authenticatedUser(); }`, a void "assert or
  # throw" method (same shape as validateHasReadPermission), real call site
  # at fineract-provider/.../ClientSearchService.java:52. Weighted LOWER than
  # the fine-grained permission family (30, not 40) on a real, stated
  # distinction, not an arbitrary number: isAuthenticated() proves a user is
  # LOGGED IN, not that they're AUTHORIZED for the specific action being
  # guarded — a materially weaker claim than validateHasPermission's
  # fine-grained check, so it must not be scored as equally strong evidence.
  - id: java-call-site-authenticated-check
    language: java
    framework: java-security-context-api
    matchSignal: "isAuthenticated"
    matchSource: call
    category: security-control
    weight: 30
    calmNodeType: service

  # Real evidence: coe-lab/fixtures/monorepo/packages/py-jwt-gateway's
  # auth_gateway.py calls `jwt.decode(token, options={"verify_signature":
  # False})` — CodeGraph's extractFromSource() reports this as a `calls`
  # entry with `referenceName: "jwt.decode"`, verified via the same direct
  # probe as the Java row above. Weighted LOWER (20, corroboration-only tier,
  # matching the import-only persistence/messaging convention) deliberately:
  # unlike a decorator or a named permission-check API, a bare `jwt.decode(...)`
  # call does NOT by itself prove verification happened — this exact fixture
  # passes `verify_signature: False`, a real anti-pattern, not a definite
  # control. Detecting the CALL is real and useful (S3: category presence ≠
  # source-security-guarantee), but must not be sold as high-confidence proof
  # of enforcement the way spring-preauthorize/java-call-site-permission-check are.
  - id: python-jwt-decode-call
    language: python
    framework: pyjwt
    matchSignal: "jwt.decode"
    matchSource: call
    category: security-control
    weight: 20
    calmNodeType: service

  # --- Java: messaging consumers (T-X7-2, G-L2-03) ---
  # @KafkaListener/@JmsListener are consumer-side markers, decorator-detected
  # via the SAME proven extractFromSource()/decorates-ref mechanism as every
  # other Java signal above — no new extraction mechanism needed, matching
  # this project's own "new signal = catalogue row" discipline. Weighted 40
  # (sufficient alone, same tier as jpa-entity/spring-preauthorize): a
  # @KafkaListener/@JmsListener annotation is decisive, first-party evidence
  # of a real messaging consumer, not a fuzzy import-only guess (contrast
  # with the SQS/SNS import-only strategy in messaging-detection-catalogue.yml,
  # deliberately kept at LOW confidence because it lacks this decisiveness).
  # Producer-side detection (KafkaTemplate.send()) is A DIFFERENT, NOT YET
  # BUILT mechanism (typed-field/call-based, not decorator-based) — honestly
  # left as a named gap, not attempted here under time pressure with an
  # unproven approach (see messaging-detection-catalogue.yml's own strategy
  # entry for this).
  - id: kafka-listener
    language: java
    framework: spring-kafka
    matchSignal: "KafkaListener"
    matchSource: decorator
    category: messaging
    weight: 40
    calmNodeType: topic

  - id: jms-listener
    language: java
    framework: jms
    matchSignal: "JmsListener"
    matchSource: decorator
    category: messaging
    weight: 40
    calmNodeType: topic

  # --- AREC Wave 3 T-E1: messaging PRODUCER (typed-field-producer strategy) ---
  # Closes messaging-detection-catalogue.yml's own "typed-field-producer"
  # gap, previously status: not-implemented. Real evidence, verified via a
  # direct extractFromSource() probe before writing this row: a reference Java/JAX-RS banking platform's
  # KafkaExternalEventProducer.java has `private KafkaTemplate<Long, byte[]>
  # externalEventsKafkaTemplate;` — CodeGraph reports a `referenceKind:
  # 'references'` entry with `referenceName: "KafkaTemplate"` (the field's
  # declared TYPE, not the a reference Java/JAX-RS banking platform-specific field NAME). Weighted 40
  # (sufficient alone, same tier as jpa-entity/kafka-listener) — real
  # finding while verifying this against KafkaExternalEventProducer.java
  # itself: an initial weight-20 "import-only tier" guess (matching SQS/SNS's
  # weak, corroboration-only tier) left this real class BELOW the 40-point
  # confidence floor with no other evidence in the file, silently producing
  # ZERO output — the exact opposite of this task's purpose. Re-evaluated: a
  # field's DECLARED TYPE as a class member is direct architectural
  # commitment (this class was built to hold a Kafka producer dependency),
  # meaningfully stronger than a bare file-level import (which only proves
  # the library is on the classpath) — the same "sufficient alone" logic
  # jpa-entity's own weight-40 comment already uses. Re-verified after the
  # fix: real KafkaExternalEventProducer.java now correctly produces a
  # `topic` unit.
  # --- AREC Wave 3 T-E3: Spring Data repository (persistence, extends-based) ---
  # Closes persistence-detection-catalogue.yml's own "spring-data-repository"
  # gap, previously status: not-implemented. Real evidence, verified via a
  # direct extractFromSource() probe before writing this row: a reference Java/JAX-RS banking platform's
  # ChargeRepository.java (`interface ChargeRepository extends
  # JpaRepository<Charge, Long>, JpaSpecificationExecutor<Charge>`) — the
  # word-boundary matcher matches "JpaRepository" correctly against the
  # captured referenceName "JpaRepository<Charge, Long>" (generic args
  # included, `<` is a non-word boundary). Weighted 40 (sufficient alone,
  # same tier as jpa-entity) — an interface extending a real Spring Data base
  # type is definite, first-party evidence of a repository, not weaker than
  # a bare @Entity.
  - id: spring-data-repository-extends
    language: java
    framework: spring-data
    matchSignal: "JpaRepository|CrudRepository|PagingAndSortingRepository|JpaSpecificationExecutor"
    matchSource: extends
    category: persistence
    weight: 40
    calmNodeType: database

  # --- AWS Lambda handler entry point (implements-based) ---
  # Real evidence, verified via a direct extractFromSource() probe before
  # writing this row (same discipline as spring-data-repository-extends
  # above): a class `implements RequestHandler<I,O>` (or the streaming
  # variant `RequestStreamHandler`) produces a real `referenceKind:
  # 'implements'` entry — folded into the SAME extends-fact pipeline
  # (codegraph-provider.ts's extractExtendsFacts, broadened) rather than a
  # parallel mechanism. Weighted 40 (sufficient alone, same tier as
  # jpa-entity/spring-data) — an `implements RequestHandler` clause is
  # definite, structural evidence of a Lambda entry point, not weaker than
  # a bare @Entity. Category is 'serverless-entry-point' — a DISTINCT
  # category from 'http-entry-point', found necessary while testing: the
  # raw signal text here is a type reference (`RequestHandler<...>`), not a
  # path, and 'http-entry-point' is also node-type-mapping.yml's
  # interfaceCategories trigger — reusing it built a bogus path-interface
  # from that type reference. 'serverless-entry-point' still wins the same
  # kind tie-break in signal-mapper.ts (treated identically to
  # 'http-entry-point' there) but stays descriptive-only for interfaces
  # until Y4 supplies a real path via CFN/SAM join. Real counterexample
  # this closes: a reference AWS SaaS sample-tier-service's TierService (HT-ASB-002),
  # mirrored in this project's own java-lambda-apigw lab fixture's
  # LegacyTierHandler.
  - id: lambda-request-handler-implements
    language: java
    framework: aws-lambda
    matchSignal: "RequestHandler|RequestStreamHandler"
    matchSource: extends
    category: serverless-entry-point
    weight: 40
    calmNodeType: service

  - id: kafka-template-field
    language: java
    framework: spring-kafka
    matchSignal: "KafkaTemplate"
    matchSource: field-type
    category: messaging
    weight: 40
    calmNodeType: topic

  # --- T-LM-2 (Lens Modules lane): retry-annotation resilience evidence ---
  # Two real, independently-published Java resilience libraries' retry
  # annotations — decorator-detected via the SAME proven
  # extractFromSource()/decorates-ref mechanism as every other Java signal
  # above (C-dec's @PreAuthorize precedent), no new extraction mechanism.
  # Weighted 40 ("sufficient alone" tier, same as jpa-entity/spring-preauthorize):
  # a real `@Retryable`/`@Retry` annotation is decisive, first-party evidence
  # of a resilience-aware class, matching the DatatableWriteService precedent
  # (a security-control-only file with no HTTP route is still a real service
  # unit — a resilience-control-only file is the same shape). Deliberately
  # narrow to RETRY annotations only, per the lane file's own gate ("not
  # 'resilience' scoped whole") — circuit-breaker/bulkhead/rate-limiter
  # annotations are a related but separate mechanism instance, not built here.
  - id: spring-retryable
    language: java
    framework: spring-retry
    matchSignal: "Retryable"
    matchSource: decorator
    category: resilience
    weight: 40
    calmNodeType: service

  - id: resilience4j-retry
    language: java
    framework: resilience4j
    matchSignal: "Retry"
    matchSource: decorator
    category: resilience
    weight: 40
    calmNodeType: service
