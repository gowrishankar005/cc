# Catalogue 2a (docs/solution/Architecture_as_Code_Solution_Design_v2.md §5.2).
# TypedUnit.kind -> CALM node-type + which evidence categories become
# CalmInterfaces vs. stay descriptive-only (confidence corroboration, no
# interface built). Adding a new unit kind is a row here, not a code change
# in node-builder.ts/interface-builder.ts.

version: "0.1.0"

mappings:
  - unitKind: service
    calmNodeType: service
    interfaceCategories: [http-entry-point]
    # 'serverless-entry-point' (Lambda implements RequestHandler) is
    # deliberately descriptive-only, not in interfaceCategories: its raw
    # signal text is a type reference, not a path. Real paths for these
    # units come from the CFN/SAM join (a different source, category
    # http-entry-point) once built.
    descriptiveCategories: [framework-bootstrap, persistence, messaging, folder-convention, serverless-entry-point, spring-config]

  - unitKind: database
    calmNodeType: database
    interfaceCategories: []
    descriptiveCategories: [persistence, spring-config]

  # A message queue/topic (Kafka topic, JMS queue, SQS queue, SNS
  # topic) maps to CALM's `network` node-type, not a new CALM-side
  # construct — matches this project's own established convention of
  # reusing an existing CALM enum value for a new architectural category
  # rather than inventing one (the same reasoning `system` got for the
  # composite/boundary case).
  - unitKind: topic
    calmNodeType: network
    interfaceCategories: []
    descriptiveCategories: [messaging, spring-config]

  # Graded fact admission — a placeholder unit
  # graphify-reconciler.ts synthesizes for the unresolved endpoint of an
  # otherwise-dropped Graphify edge (real reference, target not classifiable
  # into service/database/topic). calmNodeType is deliberately NOT one of
  # CALM's 9 real architectural node-types (misrepresenting unclassified
  # code as a real kind is worse than dropping the edge) — 'unresolved-endpoint'
  # is schema-valid (core.json's node-type-definition accepts any string)
  # but self-documents as not-a-real-architectural-claim. No interfaces or
  # descriptive metadata categories: these units carry no evidence to
  # attach any.
  - unitKind: unresolved
    calmNodeType: unresolved-endpoint
    interfaceCategories: []
    descriptiveCategories: []
