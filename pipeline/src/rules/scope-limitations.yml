# T-X0-3 (AGENT_TASKS_Extraction_Enrichment.md) — single source for the
# x-aac-scope-limitations metadata block. Previously hardcoded as a literal
# array in metadata-builder.ts and stale (it still said "HTTP-entry-point
# and Graphify-visible-persistence signals only" after JAX-RS routes, JPA
# @Entity typing, and @PreAuthorize control detection all shipped in Wave M).
# Bump `version` and edit `limitations` when a capability change makes a
# bullet wrong — this file is the fix point, not metadata-builder.ts.
#
# AREC Wave 3 T-A4 (2026-08-07) — hygiene pass against Claim_Register.md:
# several bullets below were stale (claimed "not detected" for capabilities
# that shipped in Wave X5/X7/X9/X4 as opt-in or partial mechanisms), and two
# real AREC gaps (R2 multi-hop, C-call) had no dedicated bullet at all despite
# being the primary named findings of the Fineract RCA. See
# docs/solution/Claim_Register.md for the authoritative per-mechanism status
# this file must stay aligned with.
#
# AREC Wave 3 T-D1/T-D2 (2026-08-07) — R2 shipped (T-C1) with a real,
# evidenced Fineract-charge residual (bullet below rewritten, not removed —
# the mechanism exists now but does not close the flagship real case);
# call-site controls (C-call) shipped for real (bullet rewritten from
# "unbuilt" to the narrower true-today limits: only 2 named call-site
# vocabularies, no general call-graph auth inference).
#
# AREC Wave 3 T-E1 (2026-08-08) — messaging producer detection shipped
# (KafkaTemplate field-type); bullet rewritten from "not-implemented" to the
# narrower true-today limit (field-type only, no call-site pairing, SQS/SNS
# producers still undetected).
#
# AREC Wave 3 T-E2 (2026-08-08) — new bullet: persistence-import-vs-ownership
# ambiguity (Q13, Open_Questions_Validation.md) — a real, disclosed
# limitation, not a code change this round (see the linked decision for why).

version: "0.6.0"

limitations:
  - id: k8s-manifests-opt-in-only
    text: "Kubernetes manifests are only read when --k8s-manifests <dir> is explicitly passed (opt-in, off by default) — shared-Secret/ConfigMap trust relationships (shares-secret) and env-key-name soft-graph correlation are detected when enabled; deployment image/namespace-as-decorator metadata is not (Wave X5/X9, docs/requirements/CALM_Generator_Requirements_v0_7.md §3 partial)."
  - id: env-relationship-name-correlation-only
    text: "Env/ConfigMap-mediated relationships are detected only via --enable-env-soft-graph (opt-in, requires --k8s-manifests too) and only by KEY-NAME correlation against an allowlisted suffix list — always low, fixed confidence, never a value-based inference (Wave X9)."
  - id: openapi-partial
    text: "OpenAPI/Swagger files ARE read when present at a package root (interfaces + securitySchemes) — but evidence has no line-number provenance (structural pointer only, not file:line), and build-time-generated specs with no file on disk are not discovered (T-X4-1)."
  - id: messaging-producer-field-type-only
    text: "Messaging CONSUMERS are detected via decorators (@KafkaListener/@JmsListener, Wave X7-2). Messaging PRODUCERS are detected via a KafkaTemplate-typed FIELD (T-E1) — real evidence: Fineract's KafkaExternalEventProducer.java — but this is NOT paired with a .send()/.publish() call-site check (a class could declare the field and never call it, or use a different producer client entirely); SQS/SNS producer calls specifically remain undetected (only the import-only consumer-side detection covers SQS/SNS today)."
  - id: architecture-relationships-r2-partial
    text: "Multi-hop / layered architecture relationships (e.g. HTTP resource -> application service -> persistence entity) ARE detected (T-C1 Phase 1 + T-R1-2/R2b) when the intermediate bridge's implementer is within scanned roots AND either (a) is itself a real persistence/messaging unit, or (b) directly imports exactly one such unit (R2b, the realistic 'plain service-layer implementer' shape). Real evidence: R2b resolved 11 genuine relationships in a real Fineract fineract-provider scan and 3 more in fineract-core alone. Real Fineract-charge residual, evidenced not assumed: its bridge's implementer (ChargeReadPlatformServiceImpl) is raw JDBC and imports NEITHER the entity NOR a catalogue-recognized driver, so R2b's hop correctly finds 0 candidates there — THIS specific flagship case still shows 0 service-touching relationships (see B-charge-jdbc-driver in BACKLOG.md for the one concrete remaining path). Bounded at 2 bridge hops total (service -> bridge -> implementer[-> store]) — an implementer's own implementer is never chased. The bridge-discovery mechanism relies on a structural `implements` edge (Java, TypeScript); Python has no equivalent structural interface-implementation relation, so this mechanism does not apply to Python-shaped bridges today — a real, named gap, not silently assumed solved. Every real relationship this pipeline emits is labeled with its grade (structural/architecture/trust, T-A2) and R2/R2b edges are always LOW, fixed confidence (never as certain as a direct R1 import; R2b is lower again than R2 Phase 1, two inference layers deep)."
  - id: call-site-controls-partial
    text: "Call-site security-control detection (C-call, T-D1) covers TWO named vocabularies only: Java's validateHasReadPermission/validateHasPermission/validateHasCheckerPermission (Fineract's own security API) and Python's jwt.decode (weighted low — decoding alone does not prove signature verification occurred). No general call-graph-based auth inference exists; an HTTP unit using a different call-site auth API will still show no security-control evidence. threat-signals' \"no security-control\" finding reflects this catalogue's coverage, not a confirmed absence of authorization in source (S3)."
  - id: no-intra-file-logic
    text: "General intra-file business logic (validation, non-auth control flow) is not modeled as separate units — narrower now than the two dedicated bullets above, which name the specific auth/relationship gaps."
  - id: persistence-driver-import-only
    text: "Persistence detection covers direct driver-import (SQLAlchemy, TypeORM, etc.) and JPA @Entity — Spring Data repository interfaces and jOOQ are not-implemented rows in persistence-detection-catalogue.yml."
  - id: persistence-import-vs-ownership-ambiguous
    text: "A class in a file that imports a known persistence driver library is typed database — this does NOT distinguish a class that OWNS the client (e.g. `class X extends PrismaClient`) from a business-logic service that merely imports the client's TYPES for its own method signatures (real example: Ghostfolio's AccessService imports @prisma/client for typing only, delegates real persistence to a separate PrismaService class). See Q13 (Open_Questions_Validation.md) for the full real investigation and why a fix was deliberately not shipped without re-verifying it against all evidence repos first."
  - id: confidence-not-completeness
    permanent: true
    text: "A high x-aac-confidence score reflects certainty about the SIGNALS FOUND, not completeness of the architecture picture. Silent, high-confidence architectural incompleteness is now surfaced separately via coverage-report.json's completeness.silenceFlags (S1/S2, T-A1) — a clean confidence score and a raised silence flag are not a contradiction."
