# Single source for the x-aac-scope-limitations metadata block. Previously
# hardcoded as a literal array in metadata-builder.ts and stale (it still
# said "HTTP-entry-point and Graphify-visible-persistence signals only"
# after JAX-RS routes, JPA @Entity typing, and @PreAuthorize control
# detection all shipped).
# Bump `version` and edit `limitations` when a capability change makes a
# bullet wrong — this file is the fix point, not metadata-builder.ts.
#
# Hygiene pass against Claim_Register.md: several bullets below were kept
# stale after later capability changes shipped as opt-in or partial
# mechanisms, and two real gaps (multi-hop relationships, call-site controls)
# had no dedicated bullet at all despite being primary named findings from
# real-repo evidence. See docs/solution/Claim_Register.md for the
# authoritative per-mechanism status this file must stay aligned with.

version: "0.24.0"

limitations:
  - id: k8s-manifests-opt-in-only
    text: "Kubernetes manifests are only read when --k8s-manifests <dir> is explicitly passed (opt-in, off by default) — shared-Secret/ConfigMap trust relationships (shares-secret), env-key-name soft-graph correlation, and runtime-placement relationships (deployed-in, T-MR-3: the resolved Deployment's namespace) are detected when enabled; deployment IMAGE-as-decorator metadata is still not (a Deployment's image is read for trust-detector correlation input but never surfaced as its own node/decorator)."
  - id: k8s-deployed-in-single-container-and-unresolved-only
    text: "T-MR-3 (deployed-in): DeploymentManifest.image/containers reads only the FIRST container in a pod spec (scanner/k8s-manifest-provider.ts) — a multi-container pod's other containers carry no distinguishable placement signal. A Deployment whose name doesn't resolve to a real service-kind TypedUnit (same findUnitForDeployment correlation rule the shares-secret detector already uses) is a named CROSS_DOMAIN_UNRESOLVED ignored-item, never guessed. Flat/pre-rendered manifests only — Helm/Kustomize template resolution is a permanent non-goal (OOS-helm-kustomize)."
  - id: boundary-change-override-single-membership-only
    text: "T-MR-5 (boundary_change override): a node can belong to at most one composed-of boundary at a time — applying the override always vacates any prior boundary membership before placing the node in the new one (or none, when container is explicitly null). A real use case needing a node in 2+ composed-of boundaries simultaneously is not supported; not evidenced as a real need yet."
  - id: env-relationship-name-correlation-only
    text: "Env/ConfigMap-mediated relationships are detected only via --enable-env-soft-graph (opt-in, requires --k8s-manifests too) and only by KEY-NAME correlation against an allowlisted suffix list — always low, fixed confidence, never a value-based inference."
  - id: openapi-partial
    text: "OpenAPI/Swagger files ARE read when present at a package root (interfaces + securitySchemes) — but evidence has no line-number provenance (structural pointer only, not file:line), and build-time-generated specs with no file on disk are not discovered."
  - id: messaging-producer-field-type-only
    text: "Messaging CONSUMERS are detected via decorators (@KafkaListener/@JmsListener). Messaging PRODUCERS are detected two ways: a KafkaTemplate-typed FIELD (real evidence from a reference Java/JAX-RS banking platform's KafkaExternalEventProducer.java) — NOT paired with a .send()/.publish() call-site check (a class could declare the field and never call it, or use a different producer client entirely); and import-only SQS/SNS client detection — real evidence from a lab ts-orders-dynamo fixture's OrdersDynamoStore, weight 20 (low, import proves capability not actual sends). A class already typed by an EARLIER pass (e.g. persistence) that also matches messaging now gets the messaging evidence MERGED onto its existing unit (messaging-pass.ts) rather than silently dropped, though the earlier pass's kind still wins — a database-kind unit with real messaging evidence attached is not itself surfaced as a topic node."
  - id: architecture-relationships-r2-partial
    text: "Multi-hop / layered architecture relationships (e.g. HTTP resource -> application service -> persistence entity) ARE detected when the intermediate bridge's implementer is within scanned roots AND either (a) is itself a real persistence/messaging unit, or (b) directly imports exactly one such unit (the realistic 'plain service-layer implementer' shape). Real evidence: this two-hop mechanism resolved 11 genuine relationships in a real multi-module Java scan and 3 more in a single module alone. A Java import-target normalization fix then closed the flagship residual itself: ChargeReadPlatformServiceImpl imports org.springframework.jdbc.core directly, which a Java Graphify gap (edges only ever carry the bare last symbol, never the qualified package) made silently unreachable until fixed via source-line read-back (java-import-resolver.ts) — ChargesApiResource -> ChargeReadPlatformServiceImpl is now a real, calm-validate-clean, confidence-10 relationship in a real cross-module run. Bounded at 2 bridge hops total (service -> bridge -> implementer[-> store]) — an implementer's own implementer is never chased. The bridge-discovery mechanism relies on a structural `implements` edge (Java, TypeScript); Python has no equivalent structural interface-implementation relation, so this mechanism does not apply to Python-shaped bridges today — a real, named gap, not silently assumed solved. Command-bus/dynamic-dispatch write paths (a string-keyed handler map resolved at runtime) remain a permanent, named non-goal — no static mechanism, deterministic or otherwise, resolves them. Every real relationship this pipeline emits is labeled with its grade (structural/architecture/trust) and multi-hop edges are always LOW, fixed confidence (never as certain as a direct one-hop import; the second-hop case is lower again than the first-hop case, two inference layers deep)."
  - id: stereotype-disambiguation-narrow
    text: "T-LR-3 (BACKLOG.md \"Plain-interface bridge detection\"): a multi-hop bridge with 2+ real `implements` candidates resolves ONLY when exactly one carries a bare Java `@Service` stereotype (spring-service-stereotype in signal-catalogue.yml, and specifically ONLY signals flagged bridgeStereotype:true — catalogue-driven, never a hardcoded name in the detector) AND that sole candidate is itself a database/topic unit — deliberately narrower than the name suggests in several ways. (1) `@Component`/`@Repository` are NOT covered by this catalogue row — only `@Service` has a real, cited evidence sample; adding the others needs their own evidence, not speculative bundling. (2) The disambiguated implementer does NOT also chase R2b's store-import hop — if it resolves to one real candidate but that candidate isn't itself a store, this still refuses rather than compounding a second inferred hop onto an already-ambiguity-resolved edge. (3) The stereotype match is FILE granularity, not class granularity — `TypedUnit.evidence` is attached per-file (this pipeline's units are one-per-file today), so a file containing the real, non-`@Service` implementer PLUS an unrelated `@Service`-annotated helper/inner class in the same file would falsely read as stereotype-carrying. Not reproduced against real data (no real candidate examined during real-repo verification had this shape), but a real, structural possibility given the current per-file evidence model — not silently assumed impossible. (4) Second-real-repo-instance verification: **done, real, 2026-08-16** — a reference Java/JAX-RS banking platform's charge+provider+core modules, 3-root scan, real command-source-write-platform bridge interface with 2 real implementers, correctly disambiguated to the real `@Service`-carrying one over a test-double implementer (confirmed via direct source read) — but correctly still refuses because the disambiguated implementer's own kind is `service`, not database/topic (see `Claim_Register.md`'s `R2-mechanism` row for the full real-data result: the disambiguation SELECTION logic is real-data-verified; a real r2-stereotype EMISSION — disambiguation AND landing on a terminal store — has not yet been observed in any real scan tried, only in the synthetic fixture). A second, structurally-different repo (real `@Autowired` constructor injection, not Lombok's implicit-constructor convention) was also scanned; it has zero real instances of the 2+-implementer/exactly-one-stereotyped shape at all (144 real 2+-implementer bridges examined, every one either 0 or 3+ stereotyped candidates)."
  - id: bare-implementer-list-collision-not-reproduced
    text: "multi-hop-bridge-detector.ts's T-LR-3 stereotype-disambiguation branch is the first mechanism in this file to actively PICK a winner from the raw `implementers` list (implementersByTarget), rather than only ever refusing under ambiguity. The pre-existing `graphify-reconciler.ts` bare-name-collision fix (`isBareNameCollision`) is NOT applied to this list — re-assessed, not silently assumed safe: `isBareNameCollision` requires an already-resolved TARGET NodeUnitMatch (`to.unit.id`/`to.root`), which a bridge candidate structurally can never have (bridge candidacy requires ZERO existing units) — the SAME reasoning BACKLOG.md's existing \"Possible bare-identifier collision\" row already gives for why the bridge-TARGET case is unreachable. That reasoning does not, however, cover the IMPLEMENTER list this branch walks: two real, differently-packaged classes sharing one bare name could theoretically cause Graphify's bare-label node resolution to misattribute an `implements` edge, inflating or miscounting a bridge's real implementer set. Not reproduced against real data (2026-08-16 real-repo verification found no such case), and the `implementers` list IS now deduped by resolved unit id before any length check (guards the trivial duplicate-edge case), but a genuine bare-name COLLISION between two DIFFERENT real classes remains a real, disclosed, unreproduced risk for this specific branch — a real evidence pass, not a speculative fix, is the correct next step if this is ever observed."
  - id: weak-service-unit-messaging-collision
    text: "FIXED. T-LR-3's `overridableServiceFilePaths` replace-not-duplicate fix is now applied in `detectMessagingPass` as well as `detectPersistencePass`. A file whose only service evidence is a bare framework-bootstrap stereotype plus a real import-only messaging-client library becomes one topic unit (stereotype evidence merged on), never two CALM nodes. Same-id persistence+messaging merge (ts-orders-dynamo) is unchanged. KafkaTemplate field-type detection was never this collision — it is signal-mapper evidence on the same decorator unit, not an import-strategy pass. Evidence: synthetic fixture `pipeline/test/fixtures/weak-service-messaging-sample` (TypeScript `@Controller` + `@aws-sdk/client-sqs`); the Java half of the same mechanism class is the already-shipped persistence replace (`@Service` + driver import). No real-repo instance of the exact `@Service`/`@Controller` + import-only messaging-client pair was found in the four available `spikes/` repos — disclosed, not silently claimed found-in-the-wild."
  - id: call-site-controls-partial
    text: "Call-site security-control detection covers FOUR named vocabularies: Java's validateHasReadPermission/validateHasPermission/validateHasCheckerPermission (a reference Java/JAX-RS banking platform's own security API, weight 40), Java's UserRoleService.hasRole (a reference Java governance platform's own RBAC API, weight 40 — a different real repo's own vocabulary, real NotAuthorizedException-throwing enforcement confirmed), Java's PlatformSecurityContext.isAuthenticated() (the same reference Java/JAX-RS banking platform, weight 30 — deliberately lower: proves authentication, not fine-grained authorization, a real stated distinction not an arbitrary number), and Python's jwt.decode (weight 20 — decoding alone does not prove signature verification occurred). No general call-graph-based auth inference exists; an HTTP unit using a different call-site auth API will still show no security-control evidence. The threat-signals module's \"no security-control\" finding reflects this catalogue's coverage, not a confirmed absence of authorization in source. The authorityRef field extracts a Java constant-style token (qualified enum or bare ALL_CAPS) from the call's own argument text when present — a naming-convention match, never a resolved value; absent for non-conventional argument shapes (plain variables, lowercase identifiers)."
  - id: no-intra-file-logic
    text: "General intra-file business logic (validation, non-auth control flow) is not modeled as separate units — narrower now than the two dedicated bullets above, which name the specific auth/relationship gaps."
  - id: persistence-driver-import-only
    text: "Persistence detection covers direct driver-import (SQLAlchemy, TypeORM, etc.) and JPA @Entity — Spring Data repository interfaces and jOOQ are not-implemented rows in persistence-detection-catalogue.yml."
  - id: persistence-import-vs-ownership-ambiguous
    text: "FIXED for @prisma/client. A class in a file that imports a known persistence driver library is typed database by default — this does not distinguish a class that OWNS the client from one that merely imports its TYPES for its own method signatures, UNLESS the catalogue row declares an `ownerBaseClass` (persistence-detection-catalogue.yml), in which case the class must itself declare `extends <ownerBaseClass>` (read back from real source, multi-line-aware — class-ownership-resolver.ts) to qualify. Real evidence: a reference Node/NestJS wealth-management app's AccessService (imports @prisma/client for typing only) correctly produces ZERO database units now; PrismaService (genuinely `extends PrismaClient`) correctly still does, exactly one real unit (down from 87 mislabeled ones under the old plain-import rule). Real finding while building this fix: Graphify does NOT emit an `inherits`/`extends` edge when the base class is external (no in-repo node to target) — confirmed for PrismaClient — so ownership had to be verified via source-line read-back, not a graph edge. Every OTHER driver-import library (SQLAlchemy, org.postgresql, org.jooq, Spring-JDBC, TypeORM, Mongoose, …) has NO `ownerBaseClass` set and is UNCHANGED — this fix is scoped narrowly to the libraries with real evidence, not applied blanket. T-MR-4 closed the SAME ambiguity for the AWS SDK's Dynamo clients (`@aws-sdk/client-dynamodb`, `com.amazonaws.services.dynamodbv2`, `software.amazon.awssdk.services.dynamodb`) via a composition-ownership counterpart (`ownerFieldType`, class-ownership-resolver.ts's `classDeclaresFieldOfType`) — see the next entry for that mechanism's own scope."
  - id: dynamo-field-ownership-heuristic
    text: "T-MR-4 — `ownerFieldType` (persistence-detection-catalogue.yml) resolves the composition-ownership counterpart to `ownerBaseClass`, for libraries whose real ownership idiom is a FIELD holding the client, never `extends` (the AWS SDK's Dynamo clients are never subclassed). Real, already-documented ambiguity closed: Claim_Register.md's U-persist-import counterexample (a reference AWS SaaS sample's TierService imports DynamoDbClient purely to pass it through to a method parameter, does not own it). Applied to `@aws-sdk/client-dynamodb` (TS), `com.amazonaws.services.dynamodbv2` (Java, AWS SDK v1), and `software.amazon.awssdk.services.dynamodb` (Java, AWS SDK v2) — every other driver-import library is unchanged. Verified against a real, checked-in lab fixture for the v2 SDK (java-lambda-apigw's TierStore/LegacyTierHandler/OrderStore, all genuine field owners, re-confirmed still resolve) plus two NEW synthetic fixtures isolating the negative (import-for-a-method-parameter-only) shape for the v3 Node SDK and the v1 Java SDK (`pipeline/test/fixtures/dynamo-ownership-sample`, `dynamo-ownership-java-sample`) — disclosed as synthetic, not found-in-the-wild, per Catalogue_Intake.md's requirement 1. Deliberately conservative, not full parsing: a TS/JS match requires an explicit accessibility/readonly modifier on the field or constructor-property-shorthand param (a plain, unmarked method parameter of the same type — the exact false-positive shape this guards against — never matches); a Java match requires the whole trimmed line to be a self-contained `;`-terminated declaration statement, which correctly excludes method signatures but does NOT distinguish a class field from a local variable constructed inside one of the class's own methods — a class that locally builds and uses the client within a method is still accepted as a real owner, a disclosed breadth, not a bug. `aws-sdk` (legacy v2 SDK) deliberately has no `ownerFieldType` — it is too generic (covers many AWS services under one import) for a single field-type name to be honest."
  - id: confidence-not-completeness
    permanent: true
    text: "A high x-aac-confidence score reflects certainty about the SIGNALS FOUND, not completeness of the architecture picture. Silent, high-confidence architectural incompleteness is now surfaced separately via coverage-report.json's completeness.silenceFlags (S1/S2) — a clean confidence score and a raised silence flag are not a contradiction."
  - id: test-code-exclusion-heuristic
    text: "Test-file exclusion (isTestPath()) is a real, generic path/filename heuristic — directory segments (test/, tests/, __tests__/) and filename suffix conventions (*Test.java, *Tests.java, test_*.py, *_test.py, *.test.ts, *.spec.ts) — applied to both CodeGraph-derived (decorator/native-route) and Graphify-derived (persistence/messaging import) extraction. It is structural-only, never content-based (no @Test-annotation sniffing). Real, honest edges, not silently assumed perfect: a test file that doesn't match any of these conventions (e.g. a differently-named test helper, or a language/framework whose test convention isn't one of the ones listed) is still scanned and can still produce a false architectural unit; a genuine production file that happens to match one of these naming conventions (e.g. a real class literally named FooTest.java for a non-test reason) is excluded and would need a manual override to recover. Every exclusion is a real, visible IgnoredItem (reason TEST_CODE), never a silent drop — check ignored-items-report.json/coverage-report.json before assuming a root's unit count reflects 100% of its real files."
  - id: jaxrs-composer-single-resource-class-assumption
    text: "The JAX-RS route composer (jaxrs-route-composer.ts) resolves each method's class-level @Path by the nearest PRECEDING class-level @Path in the same file (by source line number) — correct for standard top-to-bottom Java layout including nested classes, but a real, disclosed heuristic, not a structural parent-child resolution. A file whose classes are NOT laid out in simple top-to-bottom order (e.g. a method physically appearing before any class-level @Path in the file, or genuinely unusual formatting) falls back to no composed route for that method (never guesses) rather than a wrong one. Found via a real bug: before this fix, ALL classes in a file shared the FIRST class's @Path unconditionally — confirmed via a real test file from a reference Java/JAX-RS banking platform with 5 nested resource classes, all 5 methods wrongly composed to the first class's path."
  - id: unit-name-derivation
    text: "A TypedUnit's CALM `name` was previously always the raw file path (e.g. \"src/main/java/.../ChargesApiResource.java\"), regardless of node kind. Fixed: prefers the real class name (from decorator/call/type-reference/extends evidence's fromNodeName, only when fromNodeKind is 'class'), falling back to the file's own basename (extension stripped) when no single, unambiguous class name exists for that file. Two real, disclosed edges, not silently assumed perfect: (1) a file with 2+ real classes (e.g. a shared @Configuration/starter-pattern file, or a legitimate multi-resource JAX-RS file) falls back to the basename rather than guessing which class 'owns' the unit — never picks arbitrarily between real candidates; (2) languages/files with no class-level structural marker at all (e.g. Python module-level Flask/FastAPI routes) always use the basename, which is a real improvement over the raw path but is still not a hand-authored, semantically meaningful service name. `unique-id` is unaffected either way — this only changes the human-readable `name` field, never node identity."
  - id: nestjs-graphql-resolver-bootstrap-only
    text: "NestJS GraphQL is catalogued only as the class-level @Resolver bootstrap marker (nestjs-graphql-resolver-decorator, framework-bootstrap, synthetic fixture pipeline/test/fixtures/nestjs-graphql-sample). @Query/@Mutation are NOT catalogue rows: findRule() matches on language + bare decorator name, not framework, so those words would also match TypeORM's TypeScript @Query and flip a repository to service via http-entry-point weight. GraphQL operations are recovered only when CodeGraph natively types them as routes. This is corroboration of an already-typed Nest shape, not a claim that GraphQL HTTP is complete."
  - id: tier-b-single-candidate-scope
    text: "T-FS-1 (BACKLOG.md 'Tier-B residual detection'): multi-hop-bridge-detector.ts distinguishes 'one real database/topic candidate among a bridge's several syntactic implementers' from genuine multi-candidate ambiguity, and surfaces the former as a real, actionable review-queue trigger (multi-hop-single-candidate-below-threshold, Tier B in tools/review-session/triage.py) instead of a silent generic refusal. Scope is narrower than 'multi-hop ambiguity resolved': this only covers R2 Phase 1's TOP-level bridge-implementer count (implementers.length >= 2, exactly 1 is itself a store unit) — it does NOT extend to R2b's second-hop store-import ambiguity or R2c's direct-delegate store-import ambiguity, both of which still fall through to the original unresolved-multi-hop message unchanged. It never emits a relationship automatically either way (the 'never guess' rule is untouched) — it only changes what gets written to ignoredItems/review-queue.json so a human can act on it. Evidence is a synthetic fixture (pipeline/test/fixtures/r2-tier-b-candidate-sample, including a genuinely-ambiguous 2-real-store case in the same fixture proving the mechanism doesn't over-fire). A real-instance search (2026-08-16) scanned all four available spikes/ repos (waltz 3-module, fineract-charge+provider, ghostfolio api, boa ledger 3-module) for this exact shape and found 0 real positive instances — a real, checked, negative result, not an unchecked gap; the search DID find one real informative negative case (Waltz's 126-implementer Endpoint marker interface, 0 real store candidates, correctly not misclassified as Tier-B)."
  - id: contradiction-detection-java-spring-only
    text: "T-FS-3 (BACKLOG.md 'Contradiction detection between evidence sources'): contradiction-detector.ts compares exactly ONE pairing today — a k8s Deployment manifest's container image (opt-in, --k8s-manifests) against a spring-config-sourced database unit's spring.datasource.url/spring.datasource.hikari.jdbcUrl JDBC scheme (Java/Spring Boot only). It never touches confidence math (no averaging, no silent pick) — it only writes a distinguishable ignoredItems entry (contradiction:) that hitl-review-trigger.ts turns into an always-on Tier A review-queue trigger (contradicting-evidence-force-review). Never guesses, scoped PER UNIT (fixed 2026-08-16 — see below): if any real deployment agrees with a unit's own config engine, other differently-engined deployments present for unrelated concerns (e.g. a Redis cache alongside a Postgres store) don't invalidate that agreement; only when nothing agrees does '1 disagreeing engine fires, 2+ distinct disagreeing engines is genuinely ambiguous and claims nothing' apply. Does not yet cover Python/Node datastore config sources (no equivalent structured-config extraction exists for them today), OpenAPI-vs-code contradictions, or any non-datastore fact class — a real, named scope narrower than 'contradiction detection' as a general capability. Evidence: a real, unforced instance in apache/fineract (kubernetes/fineractmysql-deployment.yml's mariadb image vs. application.properties' own postgresql default) plus checked-in synthetic fixtures (pipeline/test/fixtures/spring-config-sample, contradiction-manifests/{conflicting,agreeing,ambiguous}). Two independent review passes (2026-08-16) found and fixed real bugs after initial shipping: the real-instance search itself surfaced a missing config-key form and an unresolved placeholder-default shape (both fixed, see spring-config-property-vocabulary.md); a second, independent code review then found the 'never guess' gate was global instead of per-unit, a Docker image-reference parsing gap (registry ports, multi-segment official images), a key-selection truthiness bug, a nested-placeholder corruption bug, and a JDBC-scheme-extraction duplication (3 independent copies, one of which had already drifted out of sync with a fix applied to the other two in the SAME commit) — all fixed, each with its own dedicated regression test, JDBC-scheme extraction now a single shared function (pipeline/src/analysis/jdbc-url.ts)."
  - id: serverless-http-java-only
    text: "Lambda handler entry-point detection (`implements RequestHandler`/`RequestStreamHandler`) is Java-only. Node (`exports.handler`) and Python Lambda handlers are a real, evidenced-absence gap — no real sample evidenced yet, not silently assumed covered. The unit's category is 'serverless-entry-point', deliberately distinct from 'http-entry-point' — it wins the same service/database kind tie-break in signal-mapper.ts, but stays descriptive-only for interface-building (its raw signal text is a type reference, not a path); real HTTP paths for these units come from CFN/SAM path join, a separate mechanism. The threat-signals module's and coverage-report's 'HTTP entry with no security-control' checks (S2) currently key on 'http-entry-point' only — a Lambda handler unit with no security-control evidence does NOT yet trip that same flag, a real, named residual, not silently missed."
  - id: resilience-lens-retry-timeout-only
    text: "The resilience-lens module (T-LM-2) is deliberately narrow, per its own lane-file gate: it detects exactly two Java retry annotations (Spring Retry `@Retryable`, Resilience4j `@Retry`, both decorator-sourced) and one resilience4j timeout-config shape (`resilience4j.timelimiter.instances.*.timeout-duration`, structured-config-sourced). Real, named residuals, not silently claimed covered: circuit-breaker/bulkhead/rate-limiter annotations (resilience4j has dedicated annotations for each, none catalogued here); non-Spring/non-Java retry or timeout mechanisms (e.g. Python's `tenacity`, Node's `p-retry`, plain `HttpClient` connect/read-timeout config); and any resilience posture expressed only in code (a hand-rolled retry loop) rather than a framework annotation or a structured config key. The module's findings (hasRetry/hasTimeout) are descriptive facts only — absence does not mean a unit lacks real resilience handling, only that this pipeline's narrow catalogue found none. Two further real, disclosed gaps found on review (2026-08-16): (1) the `spring-retryable`/`resilience4j-retry` catalogue rows match the bare decorator name only (`findRule()` disambiguates by language + matchSource, never by framework/package) — the exact same collision class already named for `nestjs-graphql-resolver-bootstrap-only`'s `@Query`/`@Mutation` rows. Other real annotations share these bare names (Micronaut ships its own `@Retryable`; hand-rolled AOP retry aspects commonly use `@Retry`) and would be mis-attributed to Spring Retry/Resilience4j's category/weight if present in scanned source — not yet reproduced against a real non-Spring/non-Resilience4j `@Retryable`/`@Retry` usage, so not a confirmed bug, but a structurally real risk, same as the GraphQL case. (2) Evidence quality differs by row: Resilience4j's `@Retry` is real-usage-evidenced (independently confirmed in a reference Java/JAX-RS banking platform's core module under `spikes/` — 49 files use the exact `@Retry(name=..., fallbackMethod=...)` shape; a real `run-slice` scan of that module detects 7 of them). Spring Retry's `@Retryable` and the `resilience4j.timelimiter.instances.*.timeout-duration` config key are NOT independently evidenced in any of the 4 available `spikes/` repos as of this writing — verified only against hand-authored fixtures (`pipeline/test/fixtures/resilience-lens-sample`, `coe-lab/fixtures/monorepo/packages/java-resilience-handlers`), both real, valid, documented framework syntax, but not confirmed real-world usage. The reference platform's own real timeout-adjacent vocabulary is a DIFFERENT resilience4j property, `resilience4j.retry.instances.*.wait-duration` (a retry backoff wait, not a hard call timeout) — not catalogued here, a real, separate residual."
  - id: fact-identity-endpoint-coordinates-only
    text: "T-CL-1 (BACKLOG.md 'Fact identity, incremental merge, and review history'): TypedRelationship.id is computed as kind|from|to|(mechanism-or-source) — content-derived from the relationship's own semantic coordinates, replacing the prior CALM-only `rel-${i}` positional counter (relationship-builder.ts), which changed on rerun even when the relationship set itself was unchanged. A review pass (2026-08-20) found and fixed two real, second instances of this same mechanism class rather than leaving them as disclosed risk: (1) `k8s-trust-detector.ts` could push two `shares-secret` facts for the same verifier/issuer pair when the pair shares 2+ real Secrets (e.g. a JWT signing secret and a DB credential) — no downstream layer (this id, or relationship-builder.ts's own pre-existing B-duplicate-relationship-objects CALM dedup) can distinguish them, since neither carries the secret name; fixed with the same per-pair `seenPairs` dedup env-soft-graph-detector.ts already established for an analogous many-signals-one-fact shape ('one edge, not one per key'), regression-tested. (2) `port-interface-builder.ts`'s CalmInterface id was `iface-port-${i}`, a positional index into a sorted list — deterministic per-run but not content-derived (an unrelated new port fact could shift an existing port's ordinal and therefore its id); fixed to use the port number itself (`iface-port-<port>`), which was already the real discriminator sitting there unused. Two real, disclosed edges remain, not silently assumed perfect: (a) a file rename changes the endpoint TypedUnit.id it's built from (see typed-facts.ts's own TypedUnit.id doc comment), so the relationship id changes too — by design, read by T-CL-2's incremental merge as a disappeared fact plus a new one, never patched around here; (b) a FUTURE relationship producer that (unlike every current one) pushes 2+ genuinely distinct facts sharing kind+endpoints+mechanism-or-source without its own per-pair dedup would still collide onto one id — no current producer does this (verified for all six: graphify-reconciler, multi-hop-bridge-detector, k8s-trust-detector, env-soft-graph-detector, codeql-di-pass all dedupe or are structurally single-edge-per-pair), but this is a real constraint on any NEW producer, not a solved problem in general. TypedUnit.id itself needed no change — every existing producer (mapSignalsToUnits, cdxgen/spring-config/codeql-di/graphify-import synthetic units, the graded-fact-admission unresolved placeholder) already derives it from semantic coordinates, never file:line or a run-scoped counter (verified for the Graphify-node-id case specifically: a real two-run `graphify extract` diff on 2026-08-20 confirmed graphifyy's own node ids are content-derived, not a counter)."
  - id: cross-repo-join-root-granularity-only
    text: "T-MR-2 (BACKLOG.md 'Cross-repo relationship resolution (beyond co-scanned roots)'): --repo-manifests <dir> resolves a ranked join against another repo's T-MR-1 manifest (scanner/repo-manifest-provider.ts), strictly ordered shared API-spec identity -> published artifact coordinates -> service-catalogue/DNS, each tier tried only after the one before it failed to resolve. Every relationship this mechanism produces is capped at status: requires-review and grade: structural regardless of which tier resolved it — a real, disclosed limit, not an oversight: the other repo is never scanned by this run, only its own manifest declaration is trusted. Anchored at REPO-ROOT granularity, never a specific local TypedUnit — none of the three join inputs (an OpenAPI document's title, an SBOM's dependency coordinate, a spring-config property VALUE) are attributable to one class/file more precisely than 'this root produced this evidence', so no specific unit is ever guessed as the caller. Tier 3 (service-catalogue/DNS) is exact-string match only, never substring/fuzzy — the same 'never infer from naming alone' discipline applied everywhere else in this codebase. A non-matching manifest entry produces neither a relationship nor an IgnoredItem (unlike a k8s Deployment name, a manifest entry is not itself a root-scoped correlation candidate — flagging every non-match would flood the review queue with pairs that were never real candidates). Verified end-to-end against three real, checked-in fixtures (test/fixtures/openapi-sample, cdxgen-sample, spring-config-properties-sample), one per tier — no real cross-organization two-repo pair was available in this environment to verify against (spikes/ scratch clones absent); this is a real, disclosed gap in evidence breadth, not a claim of production-scale verification."
  - id: codeql-di-resolution-local-only-di-only
    text: "T-LR-5's CodeQL DI-resolution engine (--codeql-source-root/--codeql-build-command) is opt-in: the pass is registered in DEFAULT_PASSES so any facts it produces still get graded/statused, but it is a no-op unless both flags are set — never a default-on path, and never runs in this pipeline's own CI: the free CodeQL CLI license only permits automated/CI use against an Open Source Codebase or under a paid GHAS license, and this repo has neither (no LICENSE file, checked, not assumed). Only DI resolution (stereotype-disambiguated 2+-candidate interfaces, @Bean-factory-wired stereotype-free implementations) is wired in -- the other real, measured CodeQL gap (command-bus dispatch, E1-codeql-engine-evaluation.md, 7 real edges) is not shipped, a deliberate scope decision (checklist item 7), not an oversight. Second-real-repo-instance verification (checklist item 6) could not be completed: Waltz (spikes/waltz/repo) requires Maven plus jOOQ Pro (commercial) license-gated build profile/settings this environment doesn't have -- two independent build attempts (full reactor, and a waltz-common-only build) both failed on real, pre-existing POM property-resolution errors unrelated to this mechanism's own code. Real evidence is Fineract-only (spikes/fineract/repo, fineract-charge+fineract-provider, 2105 real DI bindings, 731 new relationships, 56 new units introduced, calm validate 0 errors)."
