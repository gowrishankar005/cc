# Catalogue for messaging-detector.ts (T-X7-2, G-L2-03). Mirrors
# persistence-detection-catalogue.yml's own pattern deliberately — messaging
# has the same "different code shapes need different strategies" problem
# persistence did: a decorator-marked consumer (@KafkaListener/@JmsListener,
# decisive evidence) is a completely different detection shape from an
# import-only cloud client (SQS/SNS, weak evidence) or a typed-field producer
# call (KafkaTemplate.send(), not built at all). Naming all three here, even
# the unimplemented one, so the strategy inventory is honest and complete —
# same discipline as persistence-detection-catalogue.yml's jooq/spring-data-repository rows.

version: "0.3.0"

strategies:
  - id: import-only-cloud-client
    description: >
      A file imports a known cloud messaging-client library (SQS/SNS SDKs);
      the class Graphify says that file `contains` becomes a topic-kind
      unit. Deliberately LOW confidence (weight 20, same flat value
      persistence-detector.ts's driver-import strategy uses for the same
      reason) — importing a client library is real but WEAK evidence: it
      proves the code CAN talk to a queue/topic, not that it does, and says
      nothing about which queue/topic. Never promoted to high confidence
      from import alone, per this task's own explicit instruction.

      B-msg-prod-sqs (Robustness, real re-check) — VERIFIED against real
      evidence: lab fixture `ts-orders-dynamo`'s `OrdersDynamoStore` class
      genuinely imports both `@aws-sdk/client-dynamodb` (persistence) and
      `@aws-sdk/client-sqs` (messaging) — a real, evidenced, single-class
      dual-role shape (a large financial-services organization-aligned AWS pattern), not a hypothetical
      edge case. Previously this class's messaging evidence was silently
      DROPPED (T-E3's own fix excluded any file already claimed by an
      earlier pass, to avoid a duplicate-unique-id error, at the cost of
      losing real evidence). Fixed properly: `messaging-pass.ts` now merges
      messaging evidence onto an already-typed unit instead of dropping it
      or duplicating — real, `calm validate`-clean output confirms the
      merged unit carries BOTH `ref_aws_sdk_client_dynamodb` and
      `ref_aws_sdk_client_sqs` evidence, kind stays `database` (persistence
      still wins the kind tie, unchanged precedent).
    status: dispatched
    libraries:
      - { name: "@aws-sdk/client-sqs", language: typescript, evidenceLevel: verified } # real evidence: lab ts-orders-dynamo
      - { name: "@aws-sdk/client-sns", language: typescript, evidenceLevel: unverified }
      - { name: aws-sdk, language: typescript, evidenceLevel: unverified } # legacy v2 SDK; generic — same false-positive caveat as its persistence-detection-catalogue.yml entry

  - id: decorator-consumer
    description: >
      @KafkaListener/@JmsListener class/method annotations — decisive,
      first-party evidence of a real messaging consumer. NOT dispatched by
      messaging-detector.ts at all — implemented via the SAME decorator/
      extractFromSource() mechanism as JAX-RS routes and JPA entities
      (signal-catalogue.yml's kafka-listener/jms-listener rows, matched by
      signal-mapper.ts). Named here for strategy-inventory completeness,
      not because this dispatcher runs it — same convention as
      persistence-detection-catalogue.yml's jpa-entity entry.
    status: implemented-elsewhere
    mechanism: decorator (signal-catalogue.yml kafka-listener/jms-listener rows)

  - id: typed-field-producer
    description: >
      AREC Wave 3 T-E1 (2026-08-08) — BUILT. A field/variable's declared
      TYPE (KafkaTemplate), from CodeGraph's extractFromSource()
      `referenceKind: 'references'` entries (signal-catalogue.yml's
      kafka-template-field row, matchSource: field-type). Deliberately
      matches on the field's TYPE name, not a paired .send() call — a
      KafkaTemplate-typed field is real, sufficient-alone evidence of
      producer capability (weight 40, same tier as jpa-entity), and pairing
      it with a call-site check would need cross-referencing two different
      referenceKind extractions within one file, a real mechanism this
      pipeline hasn't built. Real evidence: a reference Java/JAX-RS banking
      platform's KafkaExternalEventProducer.java — verified via run-slice.js,
      real `topic`/`network` node at the grep-verified field declaration
      line (48), calm validate 0 errors.
    status: dispatched
    mechanism: field-type reference (codegraph-provider.ts's extractTypeReferenceFacts, signal-mapper.ts field-type loop)

  - id: spring-config-broker
    description: >
      T-PC1-7 (B-spring-config, 2026-08-09) — BUILT, same structured-config-file
      mechanism as persistence-detection-catalogue.yml's spring-config-datasource
      row: spring.kafka.bootstrap-servers / spring.rabbitmq.host+port|addresses /
      spring.activemq.broker-url read directly from application.yml/.properties
      (scanner/spring-config-provider.ts + analysis/spring-config-pass.ts).
      NOT dispatched by messaging-detector.ts at all — named here for
      strategy-inventory completeness, same convention as decorator-consumer
      above. Real, mined finding this depends on: spring.rabbitmq.addresses
      takes precedence over .host/.port when set (RabbitProperties.java's
      own field comment) — see docs/solution/language/spring-config-property-vocabulary.md.
    status: implemented-elsewhere
    mechanism: structured config file read (scanner/spring-config-provider.ts, analysis/spring-config-pass.ts)
