# Catalogue for persistence-detector.ts. Java persistence has
# at least four genuinely different code shapes — JPA @Entity classes,
# Spring Data repository interfaces, jOOQ typed queries, plain driver
# imports — and the old persistence-detector.ts hardcoded only one of them
# (a Python-shaped `PERSISTENCE_LIBRARIES` set). This catalogue is the fix
# for THAT ONE strategy: adding a new driver library is now a row here, not
# a code change. The other three strategies named in
# docs/solution/language/java.md §3.1 are NOT dispatched by this file —
# stated honestly per strategy below, not silently implied working.

version: "0.4.0"

strategies:
  - id: driver-import
    description: >
      A file imports a known persistence-library module; the class Graphify
      says that file `contains` becomes a database-kind unit. This is the
      ONLY strategy persistence-detector.ts actually dispatches — generalizes
      the prior hardcoded PERSISTENCE_LIBRARIES set into data.
    status: dispatched
    libraries:
      # Python — verified against real a reference Python microservices banking app code (both db.py files import sqlalchemy)
      - { name: sqlalchemy, language: python, evidenceLevel: verified }
      - { name: psycopg2, language: python, evidenceLevel: verified }
      - { name: pymongo, language: python, evidenceLevel: verified }
      - { name: redis, language: python, evidenceLevel: verified }
      - { name: sqlite3, language: python, evidenceLevel: verified }
      - { name: mysql, language: python, evidenceLevel: verified }
      - { name: mysqlclient, language: python, evidenceLevel: verified }
      - { name: pymysql, language: python, evidenceLevel: verified }
      # Node/TS — @prisma/client is now VERIFIED: run against a real
      # NestJS+Prisma fintech repo (ghostfolio/ghostfolio, apps/api). This
      # also found and fixed a real bug affecting every Node/TS entry in this
      # list: Graphify normalizes external package import targets to
      # `ref_<sanitized-name>` (`@prisma/client` -> `ref_prisma_client`),
      # never the literal package name — see graphify-import-target.ts.
      # Every OTHER Node/TS entry below is still unverified for its OWN
      # detection (the ref_ transform is now correctly applied to all of
      # them, but no real fixture has exercised typeorm/mongoose/etc yet).
      #
      # Ontology fix —
      # ownerBaseClass: PrismaClient. Real evidence: a plain import-only
      # count of 87 units on a reference Node/NestJS wealth-management app's apps/api was a KNOWN, DISCLOSED
      # false-positive risk (Q13) — most of those 87 were classes (e.g.
      # AccessService) importing Prisma's generated TYPES for their own
      # method signatures, not owning a database connection. The class that
      # genuinely does (PrismaService) declares `extends PrismaClient` in
      # real source (services/prisma/prisma.service.ts:13-14) — confirmed
      # this does NOT produce a Graphify `inherits` edge (external base
      # class, no in-repo node to target — see class-ownership-resolver.ts's
      # own doc comment for the full real-evidence writeup), so ownership is
      # verified via a bounded, multi-line-aware source read-back instead of
      # a graph edge. Every other catalogue library's plain-import behavior
      # is UNCHANGED — this fix is scoped to @prisma/client only, per Q13's
      # own explicit "not re-verified against the reference Python app/a reference Java/JAX-RS banking platform" deferral.
      - { name: typeorm, language: typescript, evidenceLevel: unverified }
      - { name: prisma, language: typescript, evidenceLevel: unverified }
      - { name: "@prisma/client", language: typescript, evidenceLevel: verified, ownerBaseClass: PrismaClient }
      - { name: mongoose, language: typescript, evidenceLevel: unverified }
      - { name: sequelize, language: typescript, evidenceLevel: unverified }
      - { name: pg, language: typescript, evidenceLevel: unverified }
      - { name: mysql2, language: typescript, evidenceLevel: unverified }
      - { name: ioredis, language: typescript, evidenceLevel: unverified }
      # Node/AWS cloud-native persistence, evidenced from a large
      # financial-services organization's public technology footprint.
      # DynamoDB genuinely IS a database, so it's correct to type via this
      # strategy (unlike SQS/SNS below, which are messaging, not persistence
      # — see the cloud-messaging strategy entry for why those are NOT here).
      # AREC Wave 3 T-E3 (2026-08-08) — verified via lab fixture
      # ts-orders-dynamo (real @aws-sdk/client-dynamodb import): correctly
      # detected as a real database unit. Also surfaced and fixed a real,
      # generic bug this same round — a file importing BOTH a persistence
      # AND a messaging library produced duplicate unique-ids (see
      # existingUnitFilePaths, pass-registry.ts).
      - { name: "@aws-sdk/client-dynamodb", language: typescript, evidenceLevel: verified }
      - { name: aws-sdk, language: typescript, evidenceLevel: unverified } # legacy v2 SDK; generic — covers DynamoDB use but also other AWS services, so a real false-positive risk this catalogue row doesn't hide
      # Java — a large financial-services organization-evidenced (v0.14), not yet added to real Graphify
      # import-edge matching — named here as the concrete next catalogue
      # addition, not yet dispatched (Graphify's actual edge-target naming
      # for these hasn't been verified against real Java source).
      - { name: com.mongodb, language: java, evidenceLevel: unverified }
      - { name: com.amazonaws.services.dynamodbv2, language: java, evidenceLevel: unverified }
      - { name: software.amazon.awssdk.services.dynamodb, language: java, evidenceLevel: unverified } # AWS SDK v2 for Java, distinct package from the v1 entry above
      # T-X7-4 — org.postgresql IS the PostgreSQL JDBC driver package,
      # unambiguously (not a guess: this is what the package name means).
      # protocol: JDBC is a real value in core.json#/defs/protocol
      # (verified against the installed calm-cli schema before adding this,
      # not assumed). Still evidenceLevel: unverified — no real fixture has
      # exercised THIS library's own Graphify import-edge detection yet
      # (same caveat every other Java entry in this list already carries);
      # the protocol mechanism itself is proven with a synthetic test
      # (test/regression.test.js), honestly not a real-fixture one.
      # T-R1-3 — the Java symbol-vs-package Graphify gap that kept this row
      # unreachable is fixed (java-import-resolver.ts: reads the real import
      # line back from source at the edge's own source_location, matches the
      # qualified package against this name — see that file for the full
      # real-evidence writeup). Verified against real a reference Java/JAX-RS banking platform source:
      # the reference platform's security module/.../SqlInjectionPreventerServiceImpl.java (imports
      # org.postgresql.core.Utils) now correctly becomes a real `database`
      # unit, evidence.signal = "org.postgresql.core.Utils" (the real
      # resolved import, not a guess), calm validate 0 errors.
      - { name: org.postgresql, language: java, evidenceLevel: verified, protocol: JDBC }
      # T-R1-3 — added now that the shared Java resolution fix makes this
      # reachable; see the `jooq` strategy entry below for why this couldn't
      # be added before the fix existed, and real-fixture verification.
      - { name: org.jooq, language: java, evidenceLevel: verified }
      # T-R1-3 follow-up (B-charge-jdbc-driver) — Spring's raw JDBC helper
      # package (JdbcTemplate/RowMapper/NamedParameterJdbcTemplate). REAL,
      # VERIFIED CLOSURE of the flagship a reference Java/JAX-RS banking platform-charge residual named since
      # requirements v0.9: ChargeReadPlatformServiceImpl (the real bridge
      # implementer for ChargesApiResource's read path, previously "imports 0
      # candidate store units") imports THIS package directly — with this row
      # added, it becomes its own real `database` unit (a Phase 1 "implementer
      # IS the store" case, R2b's extra hop not even needed), and
      # ChargesApiResource -> ChargeReadPlatformServiceImpl is a real,
      # calm-validated (0 errors), confidence-10 cross-root relationship in a
      # real fineract-charge+fineract-provider multi-root run. Not a synthetic
      # proof — the actual case this whole R2/R2b program was scoped around.
      - { name: org.springframework.jdbc.core, language: java, evidenceLevel: verified }

  - id: jpa-entity
    description: >
      @Entity/@Table decorator on a class. NOT dispatched by persistence-detector.ts
      at all — this strategy is already implemented via a completely
      different, separate mechanism: the decorator/extractFromSource() path
      (signal-catalogue.yml's jpa-entity row, matched by signal-mapper.ts).
      Named here for completeness of the strategy inventory, not because this
      dispatcher runs it.
    status: implemented-elsewhere
    mechanism: decorator (signal-catalogue.yml jpa-entity/jpa-table rows)

  - id: spring-data-repository
    description: >
      AREC Wave 3 T-E3 (2026-08-08) — BUILT. An interface extending
      CrudRepository/JpaRepository/PagingAndSortingRepository/JpaSpecificationExecutor,
      from CodeGraph's extractFromSource() `referenceKind: 'extends'` entries
      (signal-catalogue.yml's spring-data-repository-extends row, matchSource:
      extends). Real evidence: a reference Java/JAX-RS banking platform's ChargeRepository.java (`interface
      ChargeRepository extends JpaRepository<Charge, Long>,
      JpaSpecificationExecutor<Charge>`) — verified via run-slice.js, real
      `database` node, plus a genuine knock-on win: ChargeRepository is now a
      visible TypedUnit, so the standard R0 Graphify reconciler picks up its
      real `imports` edge to Charge (a real, additional relationship, not
      fabricated). calm validate 0 errors, 0 warnings.
    status: dispatched
    mechanism: extends reference (codegraph-provider.ts's extractExtendsFacts, signal-mapper.ts extends loop)

  - id: jooq
    description: >
      T-R1-3 (2026-08-08) — FIXED and BUILT. The root-cause Java
      symbol-vs-package Graphify gap named below is now resolved generically
      (`java-import-resolver.ts`, shared by every Java driver-import row, not
      a jOOQ-specific patch) — org.jooq is now a real `driver-import` library
      row (no separate mechanism needed; plain import detection was always
      sufficient, "typed-field usage" was never actually required). Real
      re-verification against real a reference Java governance platform source (spikes/waltz/repo,
      waltz-data module, 241 files): 229 real `database` units detected,
      evidence.signal correctly shows the real resolved import (e.g.
      "org.jooq.Record1", "org.jooq.impl.DSL", "org.jooq.DSLContext"),
      including the exact GenericSelector.java case this row was originally
      evidenced against. `calm validate` 0 errors, 0 warnings.
    status: dispatched
    mechanism: driver-import strategy (see the org.jooq row above), Java qualified-import resolved via java-import-resolver.ts (T-R1-3)

  - id: spring-config-datasource
    description: >
      T-PC1-7 (B-spring-config, 2026-08-09) — BUILT, but via a structurally
      different mechanism than every other row in this file: a real
      spring.datasource.url key read directly from a deterministically
      parsed application.yml/.properties file (scanner/spring-config-provider.ts
      + analysis/spring-config-pass.ts), never a Graphify import-edge match.
      NOT dispatched by persistence-detector.ts/detectUnitsByImportStrategy
      at all — named here for strategy-inventory completeness, same
      convention as jpa-entity/spring-data-repository above. Also feeds a
      real relationship `protocol` value (JDBC) for the first time via this
      source — see modules/calm-generator/port-interface-builder.ts's
      springConfigProtocolBySignal.
    status: implemented-elsewhere
    mechanism: structured config file read (scanner/spring-config-provider.ts, analysis/spring-config-pass.ts) — see docs/solution/language/spring-config-property-vocabulary.md for the real, mined key vocabulary

  - id: cloud-messaging-sqs-sns
    description: >
      Node/AWS SQS/SNS client imports (@aws-sdk/client-sqs, @aws-sdk/client-sns,
      aws-sdk). Deliberately NOT added as driver-import libraries: SQS/SNS are
      messaging, not persistence — the driver-import strategy always emits
      `kind: 'database'`, so adding a queue/topic client here would mistype a
      message queue as a database (the "force everything into the wrong
      kind" anti-pattern). Correct home is the messaging detection catalogue
      (messaging/`network`|`topic` kind), explicitly out of scope for this
      strategy — named here for strategy-inventory completeness only
      ("SQS/SNS → defer to messaging detection... never silent high-confidence service").
    status: not-implemented
    mechanism: would-need a new TypedUnit.kind ('topic'/'network') + contract bump, per Contract_Evolution_Policy.md §2(c)
