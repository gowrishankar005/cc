openapi: 3.0.0
info:
  title: Widgets API
  version: 1.0.0
paths:
  /widgets:
    get:
      summary: List widgets
      responses:
        '200':
          description: OK
    post:
      summary: Create a widget
      responses:
        '201':
          description: Created
  /widgets/{id}:
    get:
      summary: Get a widget
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
