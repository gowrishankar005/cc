name: pipeline test

# Runs the real regression suite (pipeline/test/regression.test.js) on every
# push/PR touching pipeline/. Note: spikes/ holds disposable scratch clones
# (see CLAUDE.md) and is NOT cloned here — those regression cases SKIP by
# design (test/regression.test.js's own skip logic), so this gives a real
# but partial signal: the checked-in NestJS fixture and the module-registry
# checks always run; the scratch-clone-dependent cases only run locally
# where those clones already exist. Honest partial coverage, not silently
# overclaiming full coverage in CI.
on:
  push:
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline-test.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so origin/main is a real, comparable ref for check-generalization.js below

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci
      - run: npm test

      # BACKLOG.md "Mechanical bug-fix generalization check" — mechanical
      # guard against the exact T-LR-1 class of bug (a hardcoded sample-repo
      # literal, or detection logic changed with no matching regression
      # test) that passive review already missed once. Same "surface it,
      # don't silently pass" posture as --strict-detect and the S-flags.
      - run: node scripts/check-generalization.js origin/main

  # Separate job (not a step in `test` above): a real Dockerfile problem
  # should be visible on its own, not block or get masked by the primary
  # regression-suite signal. `ubuntu-latest` runners ship Docker
  # preinstalled — no daemon setup needed here.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t weaver-pipeline pipeline/

      # Proves the built image actually contains a runnable
      # dist/, not just that `docker build` didn't error. run-slice.js's
      # own usage message (printed + exit 1 on zero args, see
      # orchestration/run-slice.ts's main()) is a real, already-existing
      # signal to check against — no new CLI surface needed for this smoke
      # check. The zero-args exit 1 is EXPECTED, correct behavior (not a
      # crash) — `|| true` on the run itself so that expected non-zero
      # doesn't fail this step; `grep -q` on the captured output is the
      # real pass/fail signal instead (avoids a `pipefail` false failure
      # from piping `docker run` directly into `grep`).
      - name: smoke test — image actually runs and prints real usage
        run: |
          docker run --rm weaver-pipeline > /tmp/smoke.log 2>&1 || true
          grep -q "Usage: run-slice" /tmp/smoke.log || (echo "image did not print the expected run-slice usage message:" && cat /tmp/smoke.log && exit 1)
